import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.readyplayerai.cassetto'
    compileSdk 37

    defaultConfig {
        applicationId "com.readyplayerai.cassetto"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No release keystore yet; debug signing keeps `assembleRelease` usable.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        compose = true
    }

    // AGP 9+ runs lintVital on release builds. Keep it out of the gate for now.
    lint {
        checkReleaseBuilds false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3:1.5.0-beta01'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'

    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'io.ktor:ktor-client-core:3.6.0'
    implementation 'io.ktor:ktor-client-okhttp:3.6.0'
    implementation 'io.ktor:ktor-client-content-negotiation:3.6.0'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.6.0'
    implementation 'io.ktor:ktor-client-logging:3.6.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
